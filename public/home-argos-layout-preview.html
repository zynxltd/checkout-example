<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homepage Argos layout — Preview</title>
  <link rel="stylesheet" href="/css/yg-fonts.css">
  <style>
    body {
      margin: 0;
      font-family: var(--yg-body, sans-serif);
      background: var(--yg-stone, #f2e7d8);
      color: var(--yg-pebble, #483f3a);
    }
    .wrap {
      max-width: 640px;
      margin: 48px auto;
      padding: 0 20px;
    }
    h1 {
      font-family: var(--yg-heading, Georgia, serif);
      font-size: 1.5rem;
      color: var(--yg-forest, #264f1c);
    }
    p { line-height: 1.5; }
    a {
      display: inline-flex;
      margin-top: 12px;
      padding: 12px 20px;
      border-radius: 999px;
      background: var(--yg-rose, #e3185d);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { background: #c41452; }
    code {
      font-size: 13px;
      background: #fff;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Argos-style homepage preview</h1>
    <p>
      The full layout (YouGarden header + category strip + hero + 4 CTAs) lives on the demo app route:
    </p>
    <p><code>/home-argos-preview</code></p>
    <a href="/home-argos-preview">Open preview</a>
    <p style="margin-top:24px;font-size:13px;color:#7a726c;">
      Requires demo preview login if your local site uses it.
    </p>
  </div>
</body>
</html>
