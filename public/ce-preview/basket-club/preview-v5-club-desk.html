<!DOCTYPE html>
<html lang="en" data-ygbc5="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V5 Club Desktop/Tablet</title>
  <link rel="stylesheet" href="https://use.typekit.net/hrf1tkz.css">
  <link rel="stylesheet" href="./v5-club-desk.css?v=20261117t1">
  <style>
    body { margin: 0; padding: 40px 20px; background: #ececec; font-family: Arial, sans-serif; }
    h1 { font-size: 15px; margin: 0 0 14px; color: #333; }
    .frame { max-width: 1180px; background: #fff; padding: 28px 16px; border: 1px solid #ddd; }
    .side-demo { margin-top: 24px; max-width: 280px; background: #fff; padding: 12px; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>V5 Club — desktop / tablet (no SPF)</h1>
  <div class="frame">
    <div id="ygbc5-root">
      <div id="ygbc5-inner">
        <img id="ygbc5-logo" src="./assets/yg-club-c-logo.png" alt="" width="72" height="65">
        <div id="ygbc5-lead">
          <div id="ygbc5-copy">
            <p id="ygbc5-eyebrow">Join our club &amp;</p>
            <p id="ygbc5-save">Save £110.70</p>
            <p id="ygbc5-sub">on this order</p>
            <a id="ygbc5-more" href="#">More Info</a>
          </div>
        </div>
        <div id="ygbc5-benefits">
          <div class="ygbc5-benefit">
            <img src="./assets/yg-club-icon-plant.png" alt="" width="68" height="68">
            <p class="ygbc5-benefit-label"><strong>15% Off</strong>All Plants and Accessories</p>
          </div>
          <div class="ygbc5-benefit">
            <img src="./assets/yg-club-icon-vouchers.png" alt="" width="68" height="68">
            <p class="ygbc5-benefit-label"><strong>£20</strong>In Vouchers</p>
          </div>
          <div class="ygbc5-benefit">
            <img src="./assets/yg-club-icon-van.png" alt="" width="68" height="68">
            <p class="ygbc5-benefit-label"><strong>2 x Free</strong>P&amp;P Vouchers<span class="ygbc5-worth">(Worth £6.99 Each)</span></p>
          </div>
        </div>
        <div id="ygbc5-choose" role="radiogroup">
          <label class="ygbc5-opt is-selected">
            <input type="radio" name="ygbc5-plan" value="ST007814" checked>
            <span class="ygbc5-radio" aria-hidden="true"></span>
            <span class="ygbc5-opt-text">
              <span class="ygbc5-opt-title">Auto Renewal</span>
              <span class="ygbc5-opt-price">Now £10</span>
              <span class="ygbc5-opt-meta">Per Year <span class="ygbc5-was">Was £20</span></span>
            </span>
          </label>
          <label class="ygbc5-opt">
            <input type="radio" name="ygbc5-plan" value="ST003182">
            <span class="ygbc5-radio" aria-hidden="true"></span>
            <span class="ygbc5-opt-text">
              <span class="ygbc5-opt-title">One Year</span>
              <span class="ygbc5-opt-row">
                <span class="ygbc5-opt-price">£20</span>
                <span class="ygbc5-opt-meta">No Auto Renew</span>
              </span>
            </span>
          </label>
        </div>
      </div>
    </div>
  </div>
  <div class="side-demo">
    <h1>Sidebar</h1>
    <div id="ygbc5-side">
      <a id="ygbc5-side-link" href="#">
        <img id="ygbc5-side-logo" src="./assets/yg-club-logo-v3-side.png" alt="" width="150" height="48">
        <span id="ygbc5-side-save">Save MORE!</span>
      </a>
    </div>
  </div>
</body>
</html>
