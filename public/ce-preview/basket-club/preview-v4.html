<!DOCTYPE html>
<html lang="en" data-ygbc4="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V4 — two-panel + C logo</title>
  <link rel="stylesheet" href="https://use.typekit.net/hrf1tkz.css">
  <link rel="stylesheet" href="./v4.css">
  <style>
    body { margin: 0; padding: 40px 20px; background: #ececec; font-family: Arial, sans-serif; }
    h1 { font-size: 15px; margin: 0 0 14px; color: #333; }
    .frame {
      max-width: 920px;
      background: #fff;
      padding: 40px 16px 28px;
      border: 1px solid #ddd;
      overflow: visible;
    }
    .ref { margin-top: 28px; max-width: 920px; }
    .ref img { width: 100%; height: auto; display: block; border: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>V4 — two-panel promo, C logo</h1>

  <div class="frame">
    <div id="ygbc4-root">
      <div id="ygbc4-inner">
        <div id="ygbc4-left">
          <img id="ygbc4-logo" src="./assets/yg-club-c-logo.png" alt="YouGarden Discount Club" width="62" height="56">
          <div id="ygbc4-copy">
            <p id="ygbc4-eyebrow">Join our club &amp;</p>
            <p id="ygbc4-save">Save £9.75</p>
            <p id="ygbc4-sub">on this order</p>
          </div>
          <a id="ygbc4-more" href="#">More Info Here</a>
        </div>

        <div id="ygbc4-right">
          <p id="ygbc4-benefits">Sign Up Today for 15% Off All Plants &amp; Accessories,<br>£20 in Product Vouchers, Free P&amp;P Vouchers &amp; More!</p>
          <div id="ygbc4-actions">
            <button type="button" class="ygbc4-pill" data-stno="ST007814">
              <span class="ygbc4-pill-text">Auto Renewal <strong>Now £10</strong> Per Year <span class="ygbc4-was">Was £20</span></span>
              <svg class="ygbc4-plus" viewBox="0 0 36 36" width="36" height="36" aria-hidden="true">
                <circle cx="18" cy="18" r="18" fill="#c5e085"/>
                <path d="M18 10v16M10 18h16" stroke="#802d7d" stroke-width="3.2" stroke-linecap="round"/>
              </svg>
            </button>
            <button type="button" class="ygbc4-pill" data-stno="ST003182">
              <span class="ygbc4-pill-text">12 Month Membership <strong>£20</strong> (No Auto Renewal)</span>
              <svg class="ygbc4-plus" viewBox="0 0 36 36" width="36" height="36" aria-hidden="true">
                <circle cx="18" cy="18" r="18" fill="#c5e085"/>
                <path d="M18 10v16M10 18h16" stroke="#802d7d" stroke-width="3.2" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="ref">
    <h1>Design reference</h1>
    <img src="./_v4_design.png" alt="V4 design" onerror="this.style.display='none'">
  </div>
</body>
</html>
