<!DOCTYPE html>
<html lang="en" data-ygspf="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPF frame</title>
  <link rel="stylesheet" href="https://use.typekit.net/hrf1tkz.css">
  <link rel="stylesheet" href="./v5-spf.css?v=20261117t1">
  <style>body { margin: 0; padding: 20px 10px; background: #fff; }</style>
</head>
<body>
  <div id="ygspf-root">
    <div id="ygspf">
      <div id="ygspf-inner">
        <div id="ygspf-brand">
          <img id="ygspf-logo" src="./assets/yg-blooming-fast-logo-72.png" alt="Blooming Fast" width="44" height="44">
          <p id="ygspf-title">Superior <strong>Plant Food</strong> Plus</p>
        </div>
        <div id="ygspf-msg">For better results, treat your plants before we send them to you.</div>
        <button type="button" id="ygspf-cta">
          <span class="ygspf-plus" aria-hidden="true">+</span>
          <span class="ygspf-cta-copy">
            <span class="ygspf-cta-line">Add to Basket</span>
            <span class="ygspf-cta-price">for Just £1</span>
          </span>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
