<!--
  Crazy Egg → Edit HTML on .h1Wrapper (optional).

  You do NOT need this HTML edit — the JS creates .payment-grid if missing.
  Keep cards-wrapper (We accept icons) visible beside the title.
-->
<div class="h1Wrapper">
  <h1>Your Shopping Basket</h1>

  <div class="mobile-top-total mobile-only">
    <div class="head">Basket Total:</div>
    <div class="value">£26.97</div>
  </div>

  <div class="cards-wrapper">
    <div class="cards amz"></div>
    <div class="cards paypal"></div>
    <div class="cards mastercard"></div>
    <div class="cards amex"></div>
    <div class="cards visa"></div>
    <div class="cards apple"></div>
    <div class="text">We accept:</div>
  </div>

  <!-- Optional empty shell — JS fills with Amazon | PayPal | Apple Pay -->
  <div class="payment-grid"></div>
</div>
