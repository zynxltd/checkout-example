<!--
  Fresh Relevance SoftBlock — Layout HTML
  Styles Magento homepage .frontpage > .content blurb (Gelica + size).

  Paste ALL of this into Layout HTML (not Crazy Egg).
  The SoftBlock using this layout MUST be placed on the homepage
  (any slot) so the <style>/<script> inject. Magento .content is
  outside the SoftBlock — CSS alone often won’t apply until this runs.
-->
<style>
  body > main > div.frontpage > div.content > p,
  body > div.frontpage > div.content > p,
  main .frontpage > .content > p,
  .frontpage > .content > p,
  .frontpage .content p {
    font-family: gelica, Gelica, Georgia, "Times New Roman", serif !important;
    font-size: 18px !important;
    font-weight: 700 !important;
    color: #483f3a !important;
    line-height: 1.5 !important;
  }

  @media (max-width: 767px) {
    body > main > div.frontpage > div.content > p,
    body > div.frontpage > div.content > p,
    main .frontpage > .content > p,
    .frontpage > .content > p,
    .frontpage .content p {
      font-size: 16px !important;
    }
  }
</style>
<script>
(function () {
  var FONT = 'gelica, Gelica, Georgia, "Times New Roman", serif';
  var SIZE_DESKTOP = '18px';
  var SIZE_MOBILE = '16px';
  var SEL = '.frontpage > .content > p, .frontpage .content p';
  var MAX_MS = 10000;
  var started = Date.now();

  function size() {
    return window.matchMedia && window.matchMedia('(max-width: 767px)').matches
      ? SIZE_MOBILE
      : SIZE_DESKTOP;
  }

  function apply() {
    var nodes = document.querySelectorAll(SEL);
    var i;
    var el;
    var n = 0;
    for (i = 0; i < nodes.length; i++) {
      el = nodes[i];
      if (!el || !/need a garden|easy to grow/i.test(el.textContent || '')) continue;
      el.style.setProperty('font-family', FONT, 'important');
      el.style.setProperty('font-size', size(), 'important');
      el.style.setProperty('font-weight', '700', 'important');
      el.style.setProperty('color', '#483f3a', 'important');
      el.style.setProperty('line-height', '1.5', 'important');
      n++;
    }
    return n > 0;
  }

  function tick() {
    if (apply()) return;
    if (Date.now() - started > MAX_MS) return;
    setTimeout(tick, 150);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', tick);
  } else {
    tick();
  }

  setTimeout(apply, 2000);
})();
</script>
