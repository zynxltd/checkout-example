<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V5 Responsive — desktop + tablet</title>
  <style>
    body { margin: 0; padding: 40px 20px; background: #ececec; font-family: Arial, sans-serif; }
    h1 { font-size: 15px; margin: 0 0 8px; color: #333; }
    p.note { margin: 0 0 16px; font-size: 13px; color: #666; }
    .widths { margin: 0 0 16px; display: flex; gap: 8px; flex-wrap: wrap; }
    .widths button {
      padding: 6px 12px; border: 1px solid #bbb; border-radius: 6px;
      background: #fff; cursor: pointer; font-size: 13px;
    }
    .widths button.is-on { background: #7b277b; color: #fff; border-color: #7b277b; }
    #stage {
      width: 1180px;
      max-width: 100%;
      height: 480px;
      border: 1px solid #ddd;
      background: #fff;
      overflow: hidden;
      transition: width 0.2s ease;
    }
    #stage iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <h1>V5 Responsive — desktop + tablet + mobile</h1>
  <p class="note">≥1101 desktop · ≤1100 compact · ≤900 tablet (scaled desktop 3-col) · ≤640 mobile.</p>
  <div class="widths" role="group" aria-label="Preview width">
    <button type="button" data-w="1180" class="is-on">Desktop 1180</button>
    <button type="button" data-w="1100">Compact 1100</button>
    <button type="button" data-w="900">Tablet 900</button>
    <button type="button" data-w="768">Tablet 768</button>
    <button type="button" data-w="390">Mobile 390</button>
  </div>
  <div id="stage">
    <iframe src="./preview-v5-responsive-frame.html?v=20261117r6" title="V5 responsive preview"></iframe>
  </div>
  <script>
    var stage = document.getElementById("stage");
    document.querySelectorAll(".widths button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".widths button").forEach(function (b) {
          b.classList.toggle("is-on", b === btn);
        });
        stage.style.width = btn.getAttribute("data-w") + "px";
      });
    });
  </script>
</body>
</html>
