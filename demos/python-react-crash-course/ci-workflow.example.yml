# EXERCISE 9 — enable in repo CI / copy into .github/workflows/
name: python-react-crash-course

on:
  pull_request:
    paths:
      - 'demos/python-react-crash-course/**'
  push:
    paths:
      - 'demos/python-react-crash-course/**'

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demos/python-react-crash-course/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demos/python-react-crash-course/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demos/python-react-crash-course/web/package-lock.json
      - run: npm ci
      - run: npm run build
